<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIデザインディレクタ - ログイン</title>
    <!-- Tailwind CSS (CDN) & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden relative">

    <!-- 背景の奥行きあるクリーンなグラデーション（主張を抑えたデザインに） -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-blue-500/5 blur-[120px] rounded-full pointer-events-none z-0"></div>
    <div class="absolute bottom-0 right-10 w-[300px] h-[300px] bg-indigo-500/5 blur-[80px] rounded-full pointer-events-none z-0"></div>

    <!-- ヘッダー（極限までシンプルにクリーン化、誇張表記を排除） -->
    <header class="p-6 max-w-6xl mx-auto w-full z-10 flex justify-between items-center">
        <div class="flex items-center space-x-2 select-none">
            <div class="bg-blue-600/10 text-blue-400 p-2 rounded-xl border border-blue-500/20">
                <i class="fa-solid fa-shield-halved text-lg"></i>
            </div>
            <div>
                <span class="text-xs font-bold tracking-widest text-slate-400 uppercase block leading-none">AIディレクタ</span>
                <span class="text-[9px] text-slate-500 font-mono">v1.2.4</span>
            </div>
        </div>
        <div class="text-xs text-slate-600 font-mono select-none">PORTAL ACTIVE</div>
    </header>

    <!-- メインログインフォーム -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 z-10 max-w-4xl mx-auto w-full">
        
        <div id="login-container" class="w-full max-w-md bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-8 shadow-2xl relative transition-all duration-500 ease-in-out">
            
            <div class="text-center mb-8 select-none">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-500/20 mb-4">
                    <i class="fa-solid fa-lock text-xl"></i>
                </div>
                <h1 class="text-xl font-bold text-slate-100 tracking-tight">AIデザインディレクター認証システム</h1>
                <p class="text-xs text-slate-400 mt-2">パスワードを入力してセッションを開始してください</p>
            </div>

            <!-- ログインフォーム -->
            <form onsubmit="handleSubmit(event)" class="space-y-5">
                <div>
                    <label for="password" class="block text-[11px] font-semibold text-slate-400 mb-2 tracking-wider uppercase">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="パスワードを入力してください" 
                            required
                            class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 text-slate-100 placeholder-slate-700 transition-all"
                        >
                    </div>
                </div>

                <button 
                    type="submit" 
                    class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-semibold transition-all duration-200 shadow-lg shadow-blue-500/10 flex items-center justify-center gap-2"
                >
                    認証して進む
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- ステータスメッセージ表示（暗号方式を特定させない一般的な表現） -->
            <div id="status-message" class="hidden mt-4 p-3 bg-blue-500/10 border border-blue-500/20 rounded-xl text-center text-xs text-blue-400">
                <i id="status-icon" class="fa-solid fa-spinner animate-spin mr-1.5"></i>
                <span id="status-text">認証情報を検証中...</span>
            </div>
        </div>

    </main>

    <!-- フッター -->
    <footer class="p-6 max-w-4xl mx-auto w-full z-10 text-center select-none">
        <p class="text-sm md:text-base font-medium text-slate-500 tracking-wider">
            Powered by AIIT
        </p>
    </footer>

    <!-- 復号・認証エンジン -->
    <script>
        const CONFIG_ENCRYPTED_DATA = "f7PEv0JZPYRR7S6Q9/6ra7ihvzFD6f+thgW4yHNrzPj/xLVecPlLGHYHtvbE7q7PX3fWSjDX31nvyq/CcdcPoLG+RMWurbaIlEiQDw3zYTtLpv4="; 

        const encoder = new TextEncoder();
        const decoder = new TextDecoder();

        async function deriveKey(password, salt) {
            const baseKey = await window.crypto.subtle.importKey(
                "raw",
                encoder.encode(password),
                "PBKDF2",
                false,
                ["deriveKey"]
            );
            
            return window.crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: 100000,
                    hash: "SHA-256"
                },
                baseKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );
        }


        async function decryptData(base64Data, password) {
            try {
                // Base64から配列に変換
                const rawBinaryString = atob(base64Data);
                const combined = new Uint8Array(rawBinaryString.length);
                for (let i = 0; i < rawBinaryString.length; i++) {
                    combined[i] = rawBinaryString.charCodeAt(i);
                }

                // 各種パラメータを抽出
                const salt = combined.slice(0, 16);
                const iv = combined.slice(16, 28);
                const ciphertext = combined.slice(28);

                const key = await deriveKey(password, salt);
                const decryptedBuffer = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    ciphertext
                );

                return decoder.decode(decryptedBuffer);
            } catch (error) {
                // 認証エラー（AES-GCMの改ざん検知を含む）
                throw new Error("AUTHENTICATION_FAILED");
            }
        }

        // =========================================================================
        // フロントエンド認証ハンドラー
        // =========================================================================
        const passwordInput = document.getElementById('password');

        async function handleSubmit(event) {
            event.preventDefault();
            const pass = passwordInput.value;
            if (!pass) return;

            const statusMessage = document.getElementById('status-message');
            const statusText = document.getElementById('status-text');
            const statusIcon = document.getElementById('status-icon');
            
            // 
            statusMessage.className = "mt-4 p-3 bg-blue-500/10 border border-blue-500/20 rounded-xl text-center text-xs text-blue-400 animate-pulse";
            statusMessage.classList.remove('hidden');
            statusIcon.className = "fa-solid fa-spinner animate-spin mr-1.5";
            statusText.innerText = "認証情報を検証中...";

            // 
            setTimeout(async () => {
                try {
                    //
                    const targetUrl = await decryptData(CONFIG_ENCRYPTED_DATA, pass);
                    
                    statusMessage.className = "mt-4 p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-center text-xs text-emerald-400";
                    statusIcon.className = "fa-solid fa-circle-check mr-1.5";
                    statusText.innerText = "認証に成功しました。接続中...";
                    
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 800);

                } catch (err) {
                    // 
                    statusMessage.className = "mt-4 p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-center text-xs text-red-400";
                    statusIcon.className = "fa-solid fa-circle-exclamation mr-1.5";
                    statusText.innerText = "エラー: パスワードが正しくありません。";
                    
                    setTimeout(() => {
                        statusMessage.classList.add('hidden');
                    }, 4000);
                }
            }, 600);
        }
    </script>
</body>
</html>
